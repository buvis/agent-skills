[project]
name = "agent-skills"
version = "0.2.0"
description = "Portable agent skills for AI coding assistants"
requires-python = ">=3.10"
license = "MIT"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests", "skills", "scripts"]

[tool.ruff]
# Skill and specification trees carry illustrative code in markdown, including
# deliberately bad examples. Formatting them would rewrite the lesson.
extend-exclude = ["skills", "docs"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
