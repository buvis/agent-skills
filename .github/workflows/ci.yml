name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, and current.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # enable-cache defaults to "auto", which caches on GitHub-hosted runners
      # for every event this workflow triggers on.
      - uses: astral-sh/setup-uv@v10.0.1

      # sweep-fix shells out to rg and ast-grep, and the hosted runner ships
      # neither, so 21 of its tests fail. Both come from mise, but they need
      # OPPOSITE placement, and each rule is pinned by a test:
      #
      #   rg       ON PATH, and NOT in /usr/bin. resolve_rg() checks PATH and
      #            then a bundled claude binary absent here, so it must be
      #            findable - but
      #            test_resolve_rg_exits_naming_both_candidates_when_neither_resolves
      #            sets PATH=/usr/bin:/bin and requires a RuntimeError there,
      #            so `apt install ripgrep` (which lands /usr/bin/rg) breaks
      #            it. Hence the symlink into ~/.local/bin.
      #   ast-grep OFF PATH. resolve_ast_grep() prefers a PATH copy, but
      #            test_resolve_ast_grep_matches_mise_which_output asserts the
      #            resolved path equals `mise which ast-grep`; any PATH copy
      #            or shim resolves elsewhere and fails that assertion.
      - name: Install the sweep-fix tool chain
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" use -g -y ast-grep@latest ripgrep@latest
          ln -sf "$("$HOME/.local/bin/mise" which rg)" "$HOME/.local/bin/rg"

      - name: Run the suite
        run: uv run --python ${{ matrix.python-version }} pytest

  # The same suite on a CRLF checkout and Windows path separators. 3.13 only:
  # the deny_access boundary wrappers rely on 3.11+ pathlib resolving its
  # accessor at call time, so a 3.10 lane here would pass while doing nothing.
  windows:
    runs-on: windows-latest
    env:
      # The runner's console codepage is 1252, and the fixtures are UTF-8.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      # The ubuntu `test` job's two OPPOSITE placement rules, in their Windows
      # spelling: `rg` is COPIED onto PATH (a symlink is the wrong tool on a
      # Windows runner), and `ast-grep` stays OFF PATH, so mise's shim
      # directory is never added to it.
      - name: Install the sweep-fix tool chain
        run: |
          # Pinned, not `mise-latest-windows-x64.zip`: this step runs what it
          # downloads inside a job that carries repository credentials, so the
          # artifact has to be one a checksum can vouch for. The hash below is
          # the `-windows-x64.zip` line of that release's published
          # SHASUMS256.txt. To bump: pick a newer tag from
          # https://github.com/jdx/mise/releases and change the URL and the
          # hash together, taking the hash from that release's SHASUMS256.txt.
          $zipSha256 = "9556296db217774e7dae8fc241542d6bbc2351122ba93c8df2a65d3b921d7a28"
          Invoke-WebRequest -Uri https://mise.jdx.dev/v2026.9.1/mise-v2026.9.1-windows-x64.zip -OutFile "$env:RUNNER_TEMP\mise.zip"
          $downloaded = (Get-FileHash -Algorithm SHA256 -Path "$env:RUNNER_TEMP\mise.zip").Hash.ToLower()
          if ($downloaded -ne $zipSha256) {
            Write-Host "::error::mise download does not match its published checksum: expected $zipSha256, got $downloaded"
            exit 1
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\mise.zip" -DestinationPath "$env:USERPROFILE"
          "$env:USERPROFILE\mise\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\mise\bin\mise.exe" use -g -y ast-grep@latest ripgrep@latest
          Copy-Item -Path (& "$env:USERPROFILE\mise\bin\mise.exe" which rg) -Destination "$env:USERPROFILE\mise\bin\rg.exe"

      # A missing capability has to end the lane by name. Left to the suite it
      # would surface as a skip, and a skipped test keeps the badge green over
      # the platform it was added to cover.
      - name: Verify runner capabilities
        run: |
          $missing = @()
          $probeFile = New-Item -ItemType File -Path "$env:RUNNER_TEMP\probe.txt" -Force
          $probeDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\probe-dir" -Force
          try { New-Item -ItemType SymbolicLink -Path "$env:RUNNER_TEMP\file.link" -Target $probeFile.FullName | Out-Null }
          catch { $missing += "creating a file symlink" }
          try { New-Item -ItemType SymbolicLink -Path "$env:RUNNER_TEMP\dir.link" -Target $probeDir.FullName | Out-Null }
          catch { $missing += "creating a directory symlink" }
          foreach ($tool in "bash", "mise", "rg") {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += "$tool on PATH" }
          }
          if (Get-Command ast-grep -ErrorAction SilentlyContinue) {
            $missing += "ast-grep OFF PATH, so that resolve_ast_grep falls through to mise"
          }
          try { $resolved = mise which ast-grep } catch { $resolved = "" }
          if (-not $resolved) { $missing += "ast-grep resolvable through 'mise which ast-grep'" }
          if ($missing) {
            foreach ($capability in $missing) { Write-Host "::error::the runner is missing: $capability" }
            exit 1
          }

      - name: Run the suite
        run: uv run --python 3.13 pytest

  # Five skills ship bash suites their helper scripts are the subject of.
  # pytest never sees them, so without this job they pass or fail invisibly.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run every skill's shell suite
        run: |
          status=0
          for suite in skills/*/scripts/test_*.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$suite::shell suite failed"
              status=1
            fi
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # enable-cache defaults to "auto", which caches on GitHub-hosted runners
      # for every event this workflow triggers on.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Lint braid
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      # Every skill braid can project, through the repo's own validator. The
      # suite already lints their bash blocks; this adds the frontmatter and
      # portable-path rules the validator owns.
      - name: Validate every skill
        run: |
          status=0
          for skill in skills/*/; do
            uv run python3 skills/create-skill/scripts/validate_skill.py "$skill" || status=1
          done
          exit $status

      - name: Check every skill has a changelog entry
        run: python3 scripts/check_changelog_skills.py

      - name: Test the changelog check
        run: uv run pytest scripts/test_check_changelog_skills.py -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install brief-portfolio dependencies
        run: npm --prefix skills/brief-portfolio/app ci

      - name: Test brief-portfolio
        run: npm --prefix skills/brief-portfolio/app test

      - name: Install debrief-meeting dependencies
        run: npm --prefix skills/debrief-meeting/app ci

      - name: Test debrief-meeting
        run: npm --prefix skills/debrief-meeting/app test
